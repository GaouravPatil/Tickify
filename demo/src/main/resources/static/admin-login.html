<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b0f14 0%, #1a2332 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    /* ANIMATED BACKGROUND */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-animation span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(43, 124, 255, 0.1);
      animation: float 25s infinite;
      border-radius: 50%;
    }

    .bg-animation span:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
      animation-duration: 20s;
    }

    .bg-animation span:nth-child(2) {
      left: 30%;
      animation-delay: 2s;
      animation-duration: 22s;
    }

    .bg-animation span:nth-child(3) {
      left: 50%;
      animation-delay: 4s;
      animation-duration: 18s;
    }

    .bg-animation span:nth-child(4) {
      left: 70%;
      animation-delay: 6s;
      animation-duration: 24s;
    }

    .bg-animation span:nth-child(5) {
      left: 90%;
      animation-delay: 8s;
      animation-duration: 26s;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      50% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }

    /* LOGIN CONTAINER */
    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(21, 26, 33, 0.9);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 400px;
      border: 1px solid rgba(43, 124, 255, 0.2);
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #2b7cff, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header p {
      color: #888;
      font-size: 14px;
    }

    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #2b7cff, #4ade80);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(43, 124, 255, 0.7);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 20px 10px rgba(43, 124, 255, 0);
      }
    }

    /* FORM STYLES */
    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      background: #0e1319;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      transition: all 0.3s;
      font-family: inherit;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #2b7cff;
      box-shadow: 0 0 0 3px rgba(43, 124, 255, 0.1);
    }

    .input-wrapper .icon-field {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 18px;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
    }

    .remember-me input[type="checkbox"] {
      cursor: pointer;
    }

    .forgot-password {
      color: #2b7cff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-password:hover {
      color: #4ade80;
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #2b7cff, #1e5fd4);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(43, 124, 255, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-login.loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% {
        left: -100%;
      }
      100% {
        left: 100%;
      }
    }

    .error-message {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid #f87171;
      color: #f87171;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .error-message.show {
      display: block;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      top: -100px;
      right: 30px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 1000;
      transition: top 0.5s ease-out;
      min-width: 300px;
    }

    .toast.show {
      top: 30px;
      animation: slideDown 0.5s ease-out;
    }

    @keyframes slideDown {
      from {
        top: -100px;
        opacity: 0;
      }
      to {
        top: 30px;
        opacity: 1;
      }
    }

    .toast-icon {
      font-size: 30px;
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      0% {
        transform: scale(0);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }

    .toast-content h3 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }

    .toast-content p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .footer-text {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

<!-- ANIMATED BACKGROUND -->
<div class="bg-animation">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- TOAST NOTIFICATION -->
<div class="toast" id="welcomeToast">
  <div class="toast-icon">👋</div>
  <div class="toast-content">
    <h3>Welcome Back!</h3>
    <p id="toastMessage"></p>
  </div>
</div>

<!-- LOGIN CONTAINER -->
<div class="login-container">
  <div class="login-header">
    <div class="icon">🔐</div>
    <h1>Admin Login</h1>
    <p>Enter your credentials to access the dashboard</p>
  </div>

  <div class="error-message" id="errorMessage">
    Invalid credentials. Please try again.
  </div>

  <form action="/admin/login" method="post">
  <div class="form-group">
      <label for="email">Username</label>
      <div class="input-wrapper">
        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your username"
                required
                autocomplete="username"
        >
        <span class="icon-field">👤</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
        >
        <span class="icon-field">🔒</span>
      </div>
    </div>

    <div class="remember-forgot">
      <label class="remember-me">
        <input type="checkbox" id="rememberMe">
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      Sign In
    </button>
  </form>

  <div class="footer-text">
    © 2024 Admin Portal. All rights reserved.
  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const errorMessage = document.getElementById('errorMessage');
  const welcomeToast = document.getElementById('welcomeToast');
  const toastMessage = document.getElementById('toastMessage');

  // Handle form submission
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    // Hide error message
    errorMessage.classList.remove('show');

    // Add loading state
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');
    loginBtn.textContent = 'Signing in...';

    try {
      // Make login API request
      const response = await fetch('/admin/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          username: username,
          password: password,
          rememberMe: rememberMe
        })
      });

      const data = await response.json();

      if (response.ok) {
        // Login successful
        const adminName = data.adminName || data.name || username;

        // Store admin info if remember me is checked
        if (rememberMe) {
          localStorage.setItem('adminName', adminName);
        } else {
          sessionStorage.setItem('adminName', adminName);
        }

        // Show welcome toast
        showWelcomeToast(adminName);

        // Redirect to dashboard after toast animation
        setTimeout(() => {
         window.location.href = '/admin.html';
        }, 1500);

      } else {
        // Login failed
        showError(data.message || 'Invalid credentials. Please try again.');
        resetLoginButton();
      }

    } catch (error) {
      console.error('Login error:', error);
      showError('Connection error. Please try again.');
      resetLoginButton();
    }
  });

  // Show welcome toast
  function showWelcomeToast(adminName) {
    toastMessage.textContent = `Hello, ${adminName}! Redirecting to dashboard...`;
    welcomeToast.classList.add('show');

    // Auto hide after 3 seconds
    setTimeout(() => {
      welcomeToast.classList.remove('show');
    }, 3000);
  }

  // Show error message
  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.classList.add('show');

    setTimeout(() => {
      errorMessage.classList.remove('show');
    }, 4000);
  }

  // Reset login button
  function resetLoginButton() {
    loginBtn.disabled = false;
    loginBtn.classList.remove('loading');
    loginBtn.textContent = 'Sign In';
  }

  // Check if already logged in
window.addEventListener('load', async () => {
  try {
    const response = await fetch('/admin/dashboard');
    if (response.ok) {
      window.location.href = '/admin.html';
    }
  } catch (e) {
    console.log("Not authenticated");
  }
});

// Add enter key support
document.getElementById('email').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('password').focus();
  }
});
</script>

<script>
// Add enter key support
  document.getElementById('username').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('password').focus();
    }
  });
</script>

</body>
</html>
